<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waro Soulmate — terminal portfolio</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- nakładki CRT / scanline -->
    <div class="crt-overlay"></div>
    <div class="scanline"></div>

    <main class="terminal">

        <!-- === NAGŁÓWEK === -->
        <header class="terminal-header">
            <div class="title-line">
                <span class="prompt">❯</span>
                <span class="title">Waro Soulmate</span>
                <span class="cursor-blink">█</span>
            </div>
            <div class="subtitle">
                <span class="path">~/portfolio/gallery</span>
                <span class="status">[online]</span>
            </div>
        </header>

        <!-- === FILTRY LAT === -->
        <div class="filter-bar">
            <span class="filter-label">[FILTER]</span>
            <button class="filter-btn active" data-year="all">wszystkie</button>
            <button class="filter-btn" data-year="2026">2026</button>
            <button class="filter-btn" data-year="2025">2025</button>
            <button class="filter-btn" data-year="2023">2023</button>
            <span class="filter-count" id="countDisplay">znaleziono: 0</span>
        </div>

        <!-- === SIATKA PRAC === -->
        <section class="works-grid" id="galleryGrid">
            <!-- prace będą wstawiane dynamicznie przez JavaScript -->
        </section>

        <!-- === STOPKA + KONTAKT === -->
        <footer class="terminal-footer">
            <div class="contact-block">
                <div class="contact-line">
                    <span class="prompt-small">❯</span>
                    <span class="contact-label">mail</span>
                    <span class="contact-value">waro.soulmate@terminal.art</span>
                </div>
                <div class="contact-line">
                    <span class="prompt-small">❯</span>
                    <span class="contact-label">discord</span>
                    <span class="contact-value">waro#3371</span>
                </div>
                <div class="contact-line">
                    <span class="prompt-small">❯</span>
                    <span class="contact-label">repo</span>
                    <span class="contact-value">github.com/waro-soulmate</span>
                </div>
            </div>
            <div class="footer-status">
                <span class="cursor-blink-small">█</span>
                <span class="sys-msg" id="systemMsg">SYSTEM :: SCANNING_FILES...</span>
            </div>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
