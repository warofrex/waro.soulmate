name: Update Movies Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# DODAJ TĘ SEKCJĘ
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update movies from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          node .github/scripts/update-movies.js

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add movies-data.js
          git diff --staged --quiet || (git commit -m "🔄 Automatyczna aktualizacja filmów z TMDB" && git push)
